<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SemakKilat"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>SemakKilat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a teacher's clipboard — one working column of sheet-like panels; every choice is drawn as an OMR bubble.
   Rose = the answer key (teacher's ink), graphite = student pencil, green/red = right/wrong. */
:root{
  --paper:#F2F3F6; --card:#FFFFFF; --sunk:#E9EBF0;
  --ink:#181E2C; --ink-2:#434C61; --ink-3:#707890;
  --rule:#D6DAE3; --rule-2:#E7E9EF;
  --rose:#B92D58; --rose-hi:#9E2349; --rose-soft:#F7E1E9; --on-rose:#FFFFFF;
  --pencil:#262A33; --on-pencil:#FFFFFF;
  --ok:#137A55; --ok-soft:#DBEFE5; --bad:#C2401F; --bad-soft:#F9E3DC; --warn:#8F5E0C; --warn-soft:#F5EBD3;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 10px 30px rgba(18,24,38,.07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1218; --card:#171B24; --sunk:#202532;
  --ink:#E6E8EE; --ink-2:#B2B8C6; --ink-3:#7E8597;
  --rule:#2A303D; --rule-2:#222733;
  --rose:#EC6E95; --rose-hi:#F38BAB; --rose-soft:#3A1C28; --on-rose:#1C0A12;
  --pencil:#D9DCE4; --on-pencil:#171B24;
  --ok:#41C389; --ok-soft:#132E20; --bad:#F07C5F; --bad-soft:#3A1D16; --warn:#E1AA4C; --warn-soft:#33270E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1218; --card:#171B24; --sunk:#202532;
  --ink:#E6E8EE; --ink-2:#B2B8C6; --ink-3:#7E8597;
  --rule:#2A303D; --rule-2:#222733;
  --rose:#EC6E95; --rose-hi:#F38BAB; --rose-soft:#3A1C28; --on-rose:#1C0A12;
  --pencil:#D9DCE4; --on-pencil:#171B24;
  --ok:#41C389; --ok-soft:#132E20; --bad:#F07C5F; --bad-soft:#3A1D16; --warn:#E1AA4C; --warn-soft:#33270E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer}
.bmark{display:inline-flex;gap:3px}
.bmark i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-3)}
.bmark i.on{background:var(--rose);border-color:var(--rose)}
.bname{font-family:var(--f-display);font-weight:800;font-stretch:120%;font-size:19px;letter-spacing:-.01em}
.store{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.store::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.store.cloud::before{background:var(--ok)}
.store.local::before{background:var(--warn)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;min-height:38px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--card)}
@media (max-width:640px){.top-in{gap:6px 12px;padding-block:8px}.nav{width:100%;margin-left:0}.nav button{flex:1;padding:7px 6px;min-height:36px}.store{margin-left:auto;font-size:11px}.bname{font-size:17px}.bmark i{width:9px;height:9px}.hide-xs{display:none}}

main{padding-block:26px 72px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.012em}
h1{font-size:clamp(26px,4.2vw,38px);font-weight:780;font-stretch:112%;line-height:1.1}
h2{font-size:20px;font-weight:720;font-stretch:108%}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.btn.primary:hover{background:var(--rose-hi);border-color:var(--rose-hi)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--rule))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.big{min-height:52px;padding:12px 22px;font-size:16px;border-radius:12px}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:8px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:6px 0;color:var(--rose);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* panels & forms */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.field{display:grid;gap:6px;min-width:0}
.field>span,.field legend,.lab{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12.5px}
fieldset.field{border:0;padding:0;margin:0}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-size:15px}
textarea{min-height:200px;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 3px var(--rose-soft)}
.form{display:grid;gap:18px;max-width:640px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--rose)}

.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fopt{position:relative;display:grid;gap:4px;padding:12px;border:1px solid var(--rule);border-radius:10px;cursor:pointer;background:var(--card)}
.fopt input{position:absolute;opacity:0;pointer-events:none}
.fopt b{font-family:var(--f-display);font-stretch:110%;font-size:17px}
.fopt span{font-size:12.5px;color:var(--ink-3)}
.fopt .dots{display:flex;gap:3px;margin-bottom:2px}
.fopt .dots i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--ink-3)}
.fopt:has(input:checked){border-color:var(--rose);box-shadow:0 0 0 2px var(--rose-soft) inset;background:color-mix(in srgb,var(--rose-soft) 45%,var(--card))}
.fopt:has(input:checked) .dots i:first-child{background:var(--rose);border-color:var(--rose)}
.fopt:has(input:focus-visible){outline:2.5px solid var(--rose);outline-offset:2px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.rose{background:var(--rose-soft);color:var(--rose)}
.chip.ok::before,.chip.bad::before,.chip.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:10px 24px}
.hero h1{font-size:clamp(32px,5.4vw,54px);font-stretch:116%;font-weight:800;line-height:1.02;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--rose)}
.lede{font-size:17px;color:var(--ink-2);max-width:52ch;margin-top:16px}
.steps{list-style:none;padding:0;margin:26px 0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s;color:var(--ink-2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink-2)}
.steps li:last-child::before{background:var(--pencil);border-color:var(--pencil);color:var(--on-pencil)}
.steps b{color:var(--ink)}
.hero-sheet{margin:0;position:relative}
.hero-sheet canvas{width:100%;max-width:440px;display:block;margin-inline:auto;border-radius:4px;box-shadow:var(--shadow),0 0 0 1px var(--rule);transform:rotate(-1.6deg);background:#fff;aspect-ratio:210/297;height:auto}
.hero-sheet figcaption{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px}.hero-sheet canvas{max-width:320px}}

/* quiz list */
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.qcard{display:grid;gap:10px;text-align:left;padding:18px;border:1px solid var(--rule);border-radius:14px;background:var(--card);cursor:pointer;min-width:0}
.qcard:hover{border-color:var(--ink-3)}
.qcard h3{font-size:17px;overflow-wrap:anywhere}
.qmeta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* quiz detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:600;font-size:13.5px;background:none;border:0;padding:4px 0;cursor:pointer;margin-bottom:10px}
.back:hover{color:var(--ink)}
.qhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.qhead h1{overflow-wrap:anywhere}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:none;padding:11px 14px;font-weight:600;font-size:14.5px;color:var(--ink-3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--rose)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500;margin-bottom:16px}

/* scan */
.scan-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.scan-grid{grid-template-columns:1fr}}
.drop{display:grid;justify-items:center;text-align:center;gap:12px;padding:30px 20px;border:1.5px dashed var(--ink-3);border-radius:16px;background:var(--card);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--rose);background:var(--rose-soft)}
.drop p{color:var(--ink-2);max-width:42ch}
.viewfinder{width:120px;height:auto;color:var(--ink)}
.tips{margin:0;padding:18px 20px;border-radius:14px;background:var(--sunk);font-size:14px;color:var(--ink-2)}
.tips h3{margin-bottom:8px}
.tips ul{margin:0;padding-left:18px;display:grid;gap:6px}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:8px}
.scard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px;border:1px solid var(--rule);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;min-width:0;align-items:start}
.scard:hover{border-color:var(--ink-3)}
.scard canvas{width:96px;aspect-ratio:210/297;height:auto;border-radius:3px;background:#fff;box-shadow:0 0 0 1px var(--rule)}
.scard .who{font-weight:650;overflow-wrap:anywhere;line-height:1.3}
.scard .score{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1;margin-top:6px}
.scard .score small{font-size:13px;color:var(--ink-3);font-weight:500}
.scard .notes{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.scard.busy{cursor:default;opacity:.85}
.scard.err{border-color:color-mix(in srgb,var(--bad) 45%,var(--rule));cursor:default}
.ph{width:96px;aspect-ratio:210/297;border-radius:3px;background:repeating-linear-gradient(180deg,var(--sunk) 0 6px,var(--card) 6px 10px);position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--rose);top:0;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
#queueTop{scroll-margin-top:130px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:28px 0 10px}

/* results */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--rule)}
.tile .k{font-size:12.5px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.res-grid{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:14px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:650;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--card)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--paper)}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nm{font-weight:600;min-width:140px}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-display);font-weight:800;font-size:14px;border:1.5px solid var(--ink-3);color:var(--ink)}
.grade.gA{background:var(--pencil);border-color:var(--pencil);color:var(--on-pencil)}
@media (max-width:560px){.hide-sm{display:none}}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;border-radius:0 4px 4px 0;position:relative}
.bar .track i{position:absolute;inset:0 auto 0 0;background:var(--rose);border-radius:0 4px 4px 0;min-width:2px}
.bar .n{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.bar-note{font-size:12px;color:var(--ink-3);margin-top:10px}
.pending{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* analysis */
.pbar{display:inline-block;width:64px;height:8px;border-radius:0 4px 4px 0;background:var(--sunk);vertical-align:middle;margin-right:8px;position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--ink-2);border-radius:0 4px 4px 0}
.dist{display:flex;gap:6px;align-items:flex-end}
.dcol{display:grid;justify-items:center;gap:2px;width:26px;font-size:11px;color:var(--ink-3)}
.dcol .b{width:14px;height:30px;display:flex;align-items:flex-end}
.dcol .b i{display:block;width:100%;background:var(--ink-3);opacity:.55;border-radius:3px 3px 0 0;min-height:1px}
.dcol.ok .b i{background:var(--ok);opacity:1}
.dcol.ok b{color:var(--ok)}
.dcol b{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.kchip{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--rose);color:var(--on-rose);font-family:var(--f-mono);font-weight:600;font-size:13px}
.kchip.none{background:var(--sunk);color:var(--ink-3)}
.legend-note{font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:80ch}

/* key editor */
.key-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:18px}
@media (max-width:700px){.key-tools{grid-template-columns:1fr}}
.settabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.settabs button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.settabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.keygrid{columns:232px;column-gap:28px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 18px}
.krow{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--rule-2);break-inside:avoid}
.kn{width:28px;text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--ink-3);font-weight:600}
.kbubs{display:flex;gap:6px}
.bub{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--card);font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .08s}
.bub:active{transform:scale(.92)}
.bub.on{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.bub.pick{background:var(--pencil);border-color:var(--pencil);color:var(--on-pencil)}
.bub.pick.bad{background:var(--bad);border-color:var(--bad);color:var(--card)}
.bub.pick.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.bub.key{box-shadow:0 0 0 2.5px var(--ok-soft),0 0 0 4px var(--ok)}
.progress{font-size:13.5px;color:var(--ink-2)}

/* ================= answer sheet geometry (all in mm on A4) ================= */
const FORMS={1:{size:20,nOpt:4},2:{size:20,nOpt:5},3:{size:50,nOpt:4},4:{size:50,nOpt:5},5:{size:100,nOpt:4},6:{size:100,nOpt:5}};

const _lay={};
function layoutFor(code){
  if(_lay[code])return _lay[code];
  const f=FORMS[code],g=GEOM[f.size],rows=Math.ceil(f.size/g.cols),slot=174/g.cols,colW=g.lab+f.nOpt*g.opt;
  const q=[],colX=[];
  for(let c=0;c<g.cols;c++){
    const x0=18+c*slot+(slot-colW)/2;colX.push(x0);
    for(let r=0;r<rows;r++){
      const n=c*rows+r+1;if(n>f.size)break;
      const y=Q_Y0+r*g.pitch;
      q.push({n,c,row:r,lx:x0+g.lab-1.6,y,b:Array.from({length:f.nOpt},(_,i)=>({x:x0+g.lab+g.opt*(i+.5),y}))});
    }
  }
  const id=Array.from({length:IDG.digits},(_,c)=>Array.from({length:10},(_,d)=>({x:IDG.x0+c*IDG.dx,y:IDG.y0+d*IDG.dy})));
  const set=Array.from({length:SETG.n},(_,i)=>({x:SETG.x0+i*SETG.dx,y:SETG.y}));
  return _lay[code]={code,...f,g,rows,q,id,set,r:g.r,colX,colW};
}

/* pens: the same drawing code renders the canvas preview and the vector PDF */
class CanvasPen{
  constructor(ctx,k){this.c=ctx;this.k=k;}
  rect(x,y,w,h,o={}){const c=this.c,k=this.k;if(o.fill){c.fillStyle=o.fill;c.fillRect(x*k,y*k,w*k,h*k);}if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=(o.lw||.25)*k;c.strokeRect(x*k,y*k,w*k,h*k);}}
  circle(x,y,r,o={}){const c=this.c,k=this.k;c.beginPath();c.arc(x*k,y*k,r*k,0,Math.PI*2);if(o.fill){c.fillStyle=o.fill;c.fill();}if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=(o.lw||.25)*k;c.stroke();}}
  line(x1,y1,x2,y2,o={}){const c=this.c,k=this.k;c.beginPath();c.setLineDash(o.dash?o.dash.map(v=>v*k):[]);c.moveTo(x1*k,y1*k);c.lineTo(x2*k,y2*k);c.strokeStyle=o.stroke||'#000000';c.lineWidth=(o.lw||.25)*k;c.stroke();c.setLineDash([]);}
  text(s,x,y,o={}){const c=this.c,k=this.k;c.font=`${o.bold?700:400} ${(o.size||3)*k}px Arial, Helvetica, sans-serif`;c.fillStyle=o.color||'#000000';c.textAlign=o.align||'left';c.textBaseline=o.mid?'middle':'alphabetic';c.fillText(s,x*k,y*k);}
  image(lg,x,y,w,h){if(lg.img)this.c.drawImage(lg.img,x*this.k,y*this.k,w*this.k,h*this.k);}
}
class PdfPen{
  constructor(d){this.d=d;this.pdf=true;}
  _st(o){const d=this.d;if(o.fill)d.setFillColor(o.fill);if(o.stroke){d.setDrawColor(o.stroke);d.setLineWidth(o.lw||.25);}return o.fill&&o.stroke?'FD':o.fill?'F':'S';}
  rect(x,y,w,h,o={}){const st=this._st(o);this.d.rect(x,y,w,h,st);}
  circle(x,y,r,o={}){const st=this._st(o);this.d.circle(x,y,r,st);}
  line(x1,y1,x2,y2,o={}){const d=this.d;d.setDrawColor(o.stroke||'#000000');d.setLineWidth(o.lw||.25);if(o.dash)d.setLineDashPattern(o.dash,0);d.line(x1,y1,x2,y2);if(o.dash)d.setLineDashPattern([],0);}
  text(s,x,y,o={}){const d=this.d;d.setFont('helvetica',o.bold?'bold':'normal');d.setFontSize((o.size||3)*2.8346);d.setTextColor(o.color||'#000000');d.text(String(s),x,y,{align:o.align||'left',baseline:o.mid?'middle':'alphabetic'});}
  image(lg,x,y,w,h){try{this.d.addImage(lg.url,'JPEG',x,y,w,h);}catch(e){}}
}
function bubble(p,x,y,r,t){p.circle(x,y,r,{stroke:'#333333',lw:.28});p.text(t,x,y+r*.05,{size:r*.92,color:'#8c8c8c',align:'center',mid:true});}

  p.circle(101,77,2,{fill:K});p.text('Betul',105,77.9,{size:2.4,color:M});

  p.line(100,89.2,100.8,90,{lw:.35});p.line(100.8,90,102.3,87.8,{lw:.35});
  p.line(106.4,87.9,108.6,90.1,{lw:.35});p.line(108.6,87.9,106.4,90.1,{lw:.35});
  p.circle(114,89,.7,{fill:K});
  p.text('Salah',118,89.9,{size:2.4,color:M});
  p.rect(146,27,42,72,{stroke:M,lw:.25});
  p.text('NO. MURID',167,31.6,{size:2.8,bold:true,align:'center'});
  L.id.forEach(col=>{const x=col[0].x;p.rect(x-3,34,6,6,{stroke:M,lw:.2});col.forEach((b,d)=>bubble(p,b.x,b.y,IDG.r,String(d)));});

  L.colX.forEach(x0=>{for(let r=4;r<L.rows-1;r+=5){const y=Q_Y0+(r+.5)*L.g.pitch;p.line(x0,y,x0+L.colW,y,{stroke:'#bbbbbb',lw:.15,dash:[.8,.8]});}});

function sheetCanvas(code,o,ppm){const c=document.createElement('canvas');c.width=Math.round(210*ppm);c.height=Math.round(297*ppm);drawSheet(new CanvasPen(c.getContext('2d'),ppm),code,o);return c;}

/* ================= scanner: photo -> marks ================= */
function homography(src,dst){
  const A=[];
  for(let i=0;i<4;i++){const[x,y]=src[i],[X,Y]=dst[i];A.push([x,y,1,0,0,0,-x*X,-y*X,X]);A.push([0,0,0,x,y,1,-x*Y,-y*Y,Y]);}
  for(let c=0;c<8;c++){

const GRADES=[{g:'A',min:80,d:'Cemerlang'},{g:'B',min:65,d:'Baik'},{g:'C',min:50,d:'Memuaskan'},{g:'D',min:40,d:'Mencapai tahap minimum'},{g:'E',min:0,d:'Belum mencapai tahap minimum'}];
const gradeOf=p=>GRADES.find(x=>p>=x.min-1e-9).g;
function keyFor(q,set){const k=(q.keys&&(q.keys[set]||q.keys.A))||[];return Array.from({length:q.nQ},(_,i)=>k[i]||'');}
function keyCount(q){let done=0,total=0;for(let s=0;s<(q.nSets||1);s++){const k=keyFor(q,LET[s]);total+=q.nQ;done+=k.filter(Boolean).length;}return{done,total};}
function gradeScan(q,s){
  const key=keyFor(q,s.set||'A');let score=0,total=0;const per=[];
  for(let i=0;i<q.nQ;i++){const k=key[i];if(!k){per.push(null);continue;}total++;const a=(s.answers||'')[i]||'-';const ok=LET.includes(a)&&k.includes(a);if(ok)score++;per.push(ok);}
  return{score,total,pct:total?score/total*100:0,per};
}
function rosterOf(q){return(q&&q.classId&&S.classes?.[q.classId]?.students)||[];}
function studentFor(q,s){const ro=rosterOf(q),nid=normId(s.studentId),st=nid?ro.find(x=>normId(x.id)===nid):null;return{name:s.name||st?.name||(s.studentId?`Murid No. ${s.studentId}`:'Tanpa No. Murid'),inRoster:!!st};}
function scanNotes(q,s){
  const n=[],a=(s.answers||'').slice(0,q.nQ).padEnd(q.nQ,'-'),bl=[...a].filter(c=>c==='-').length,mu=[...a].filter(c=>c==='*').length;
  if(!s.studentId&&!s.name)n.push(['warn',(s.idRaw||'').includes('?')?'No. murid bertindih':'Tiada No. murid']);
  else if(s.studentId&&rosterOf(q).length&&!studentFor(q,s).inRoster&&!s.name)n.push(['warn','No. tiada dalam kelas']);
  if(mu)n.push(['warn',`${mu} jawapan berganda`]);
  if(bl)n.push(['',`${bl} kosong`]);
  if((q.nSets||1)>1&&!s.setRead&&!s.edited)n.push(['warn','Set tidak ditanda']);
  if(s.demo&&!q.demo)n.push(['rose','Latihan']);
  return n;
}
function resultRows(q){return Object.entries(S.scans).map(([sid,s])=>({sid,s,g:gradeScan(q,s),...studentFor(q,s)}));}

/* overlay of the grading result on a rectified sheet image */
function drawMarks(x,k,L,nQ,key,ans){
  const ring=(b,r,col,lw,dash)=>{x.beginPath();x.setLineDash(dash?[3*k/2,2*k/2]:[]);x.arc(b.x*k,b.y*k,(r+.9)*k,0,Math.PI*2);x.strokeStyle=col;x.lineWidth=lw*k;x.stroke();x.setLineDash([]);};
  for(let i=0;i<Math.min(nQ,L.q.length);i++){
    const q=L.q[i],a=ans[i]||'-',kk=key[i]||'',ai=LET.indexOf(a);
    if(ai>=0&&q.b[ai])ring(q.b[ai],L.r,!kk?'#8a8f9c':kk.includes(a)?'#12a06a':'#e2462b',.75);
    if(kk)for(const ch of kk)if(ch!==a){const b=q.b[LET.indexOf(ch)];if(b)ring(b,L.r,'#12a06a',.45,true);}
    if(a==='-'||a==='*'){x.fillStyle='#e39b17';x.beginPath();x.arc((q.lx-4.6)*k,q.y*k,1*k,0,Math.PI*2);x.fill();}
  }
}

function parseRoster(txt){
  const out=[],used=new Set();let auto=1;
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(/^(bil|no\.?|id|nombor)\b/i.test(l)&&/nama/i.test(l))return;
    const m=l.match(/^(\d{1,5})[\s,;.\t)\-]+(.+)$/);let id,name;
    if(m){id=String(parseInt(m[1],10));name=m[2];}else{while(used.has(String(auto)))auto++;id=String(auto);name=l;}
    name=name.replace(/[\t,;]+/g,' ').replace(/\s+/g,' ').trim();if(!name)return;
    if(used.has(id))return;used.add(id);out.push({id,name});
    if(/^\d+$/.test(id))auto=Math.max(auto,+id+1);
  });
  return out;
}

async function startStream(devId){

  const size={width:{ideal:1920},height:{ideal:1440}};
  const tries=devId?[{...size,deviceId:{exact:devId}},{...size,facingMode:{ideal:'environment'}}]:[{...size,facingMode:{ideal:'environment'}}];
  let err=null;
  for(const video of tries){try{LV.stream=await navigator.mediaDevices.getUserMedia({audio:false,video});break;}catch(e){err=e;if(e?.name==='NotAllowedError')break;}}

  let caps={};try{caps=LV.track.getCapabilities?.()||{};}catch(e){}
  const adv=[];
  if(caps.zoom&&typeof caps.zoom.min==='number')adv.push({zoom:caps.zoom.min});
  if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))adv.push({focusMode:'continuous'});
  for(const a of adv){try{await LV.track.applyConstraints({advanced:[a]});}catch(e){}}
  try{LV.devId=LV.track.getSettings?.().deviceId||devId||'';}catch(e){LV.devId=devId||'';}
  const v=$('#lvVideo');if(v){v.srcObject=LV.stream;try{await v.play();}catch(e){}}
  const tb=$('#lvTorch');if(tb){tb.hidden=!caps.torch;tb.classList.remove('on');}LV.torch=false;
}

function liveTick(){
  if(LV.state==='off'||LV.state==='failed')return;

  const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;
  const s=Math.min(1,720/Math.max(vw,vh)),c=LV.small;c.width=Math.round(vw*s);c.height=Math.round(vh*s);
  c.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);

  if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,cw,ch);
  const vw=v.videoWidth,vh=v.videoHeight,sc=Math.min(cw/vw,ch/vh),ox=(cw-vw*sc)/2,oy=(ch-vh*sc)/2;
  if(quad){
    const pts=quad.map(p=>[ox+p[0]*sc,oy+p[1]*sc]),good=LV.state==='hold'||LV.stable>=2,col=good?'#41c389':'#ffd166';
    x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
    x.fillStyle=good?'rgba(65,195,137,.18)':'rgba(255,255,255,.08)';x.fill();x.lineWidth=3;x.strokeStyle=col;x.stroke();

}

function csvOf(q,sep){
  const rows=resultRows(q).sort((a,b)=>a.name.localeCompare(b.name));
  const cell=v=>{v=String(v??'');return sep===','&&/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v.replace(/[\t\n]/g,' ');};
  const head=['Nama','No. Murid','Set','Skor','Jumlah','Peratus','Gred',...Array.from({length:q.nQ},(_,i)=>`S${i+1}`)];
  const lines=[head,...rows.map(r=>[r.name,r.s.studentId,r.s.set,r.g.score,r.g.total,Math.round(r.g.pct),gradeOf(r.g.pct),...Array.from({length:q.nQ},(_,i)=>(r.s.answers||'')[i]||'-')])];
  return lines.map(l=>l.map(cell).join(sep)).join('\n');
}
const fileSafe=s=>String(s).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'kuiz';

const ACT={
  liveOpen:()=>liveOpen(),
  liveClose:()=>liveClose(),
  liveShoot:()=>{if(!LV.busy&&(LV.state==='search'||LV.state==='hold'))liveCapture(LV.quad,true);},
  liveTorch:()=>liveTorch(),
  liveSwitch:()=>liveSwitch(),
  logoRemove:()=>{Store?.setSettings({...S.settings,logo:''}).then(()=>toast('Logo dibuang'),()=>toast('Logo tidak dapat dibuang.'));},
  backupSave:()=>{const d=Store?.exportAll?.();if(!d)return;offerFile(`semakkilat-sandaran-${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(d)],{type:'application/json'}),'json');},
  go:t=>{flushKey();S.view=t.dataset.view;S.confirm=null;render();window.scrollTo(0,0);},
  newQuiz:()=>{S.view='newquiz';render();window.scrollTo(0,0);setTimeout(()=>$('#nqName')?.focus(),30);},
  openQuiz:t=>openQuiz(t.dataset.id),
  tab:t=>{flushKey();S.tab=t.dataset.tab;S.confirm=null;render();},
  demo:()=>createDemo(),
  sampleScan:()=>sampleScan(),
  openScan:t=>openScanModal(t.dataset.sid),
  keySet:t=>{S.keySet=t.dataset.set;render();},
  anSet:t=>{S.anSet=t.dataset.set;render();},
  keyBub:t=>{const i=+t.dataset.q,L=t.dataset.l;editKey(k=>{const cur=k[i]||'';k[i]=S.keyMulti?(cur.includes(L)?cur.replace(L,''):[...cur+L].sort().join('')):(cur===L?'':L);return k;});},
  keyQuick:()=>{const q=curQuiz(),v=($('#kQuick')?.value||'').toUpperCase().replace(/[^A-E]/g,''),nOpt=FORMS[q.code].nOpt;if(!v){toast('Taip huruf A–'+LET[nOpt-1]+' dahulu.');return;}
    const bad=[...v].find(c=>LET.indexOf(c)>=nOpt);if(bad){toast(`Borang ini hanya ada pilihan A–${LET[nOpt-1]}.`);return;}
    editKey(k=>{[...v].slice(0,q.nQ).forEach((c,i)=>k[i]=c);return k;});toast(`${Math.min(v.length,q.nQ)} jawapan diisi`);},
  keyClear:()=>editKey(k=>k.map(()=>'')),
  confirm:t=>{S.confirm=t.dataset.what;render();},
  confirmOff:()=>{S.confirm=null;render();},
  delQuizYes:async()=>{const id=S.quizId;S.confirm=null;S.view='quizzes';S.unsubScans?.();S.scansFor=null;S.scans={};render();try{await Store.delQuiz(id);toast('Kuiz dipadam');}catch(e){toast('Kuiz tidak dapat dipadam.');}},
  printFor:()=>{const q=curQuiz();S.sheet={code:q.code,title:q.name,cls:S.classes?.[q.classId]?.name||''};S.view='sheets';render();window.scrollTo(0,0);},
  newClass:()=>{S.view='class';S.classId=null;S.confirm=null;render();setTimeout(()=>$('#cName')?.focus(),30);},
  openClass:t=>{S.view='class';S.classId=t.dataset.id;S.confirm=null;render();window.scrollTo(0,0);},
  delClassYes:async()=>{const id=S.classId;S.confirm=null;S.view='classes';render();try{await Store.delClass(id);toast('Kelas dipadam');}catch(e){toast('Kelas tidak dapat dipadam.');}},
  sheetPdf:async()=>{
    if(!window.jspdf){toast('Penjana PDF belum dimuatkan. Cuba PNG.');return;}
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});drawSheet(new PdfPen(doc),S.sheet.code,sheetOpts());
    offerFile(`lembaran-jawapan-${FORMS[S.sheet.code].size}-${LET[FORMS[S.sheet.code].nOpt-1]}.pdf`,doc.output('blob'),'pdf');},
  sheetPng:async()=>{const c=sheetCanvas(S.sheet.code,sheetOpts(),300/25.4);const b=await new Promise(r=>c.toBlob(r,'image/png'));offerFile(`lembaran-jawapan-${FORMS[S.sheet.code].size}-${LET[FORMS[S.sheet.code].nOpt-1]}.png`,b,'png');},
  exportCsv:()=>{const q=curQuiz();offerFile(`${fileSafe(q.name)}-keputusan.csv`,new Blob(['﻿'+csvOf(q,',')],{type:'text/csv'}),'csv');},
  copyTsv:()=>{const q=curQuiz(),t=csvOf(q,'\t');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast('Disalin. Tampal ke Excel atau Google Sheets.'),()=>showFallback('keputusan.csv',new Blob([t]),'csv'));}else showFallback('keputusan.csv',new Blob([t]),'csv');},
  fbCopy:()=>{const ta=$('#fbText');if(!ta)return;ta.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(ta.value).then(()=>toast('Disalin'),()=>toast('Teks dipilih. Tekan Ctrl+C untuk salin.'));},
  mClose:()=>{S.m=null;renderModal();},
  mAns:t=>{const i=+t.dataset.q,L=t.dataset.l,d=S.m.d,q=curQuiz();let a=(d.answers||'').padEnd(Math.max(q.nQ,(d.answers||'').length),'-').split('');a[i]=a[i]===L?'-':L;d.answers=a.join('');renderModal();},
  mDel:()=>{S.m.conf=true;renderModal();},
  mDelNo:()=>{S.m.conf=false;renderModal();},
  mDelYes:async()=>{const q=curQuiz(),sid=S.m.sid;S.m=null;renderModal();try{await Store.delScan(q.id,sid);toast('Kertas dipadam');}catch(e){toast('Kertas tidak dapat dipadam.');}},
  mSave:async()=>{
    const q=curQuiz(),m=S.m,d={...m.d,edited:true};
    const idv=($('#mId')?.value||'').trim();d.studentId=normId(idv);
    const nm=$('#mName');if(nm)d.name=nm.value.trim();
    const ms=$('#mSet');if(ms)d.set=ms.value;
    let sid=m.sid;const want=d.studentId?'m'+d.studentId:(sid.startsWith('m')?uid('x'):sid);
    try{
      if(want!==sid){if(S.scans[want])toast('Rekod lama murid ini digantikan');await Store.setScan(q.id,want,d);await Store.delScan(q.id,sid);sid=want;}
      else await Store.setScan(q.id,sid,d);
      S.queue.forEach(it=>{if(it.sid===m.sid)it.sid=sid;});
      S.m=null;renderModal();toast('Perubahan disimpan');
    }catch(e){toast('Tidak dapat disimpan. Cuba lagi.');}
  },
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  if(t.tagName==='A')e.preventDefault();
  const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){S.m=null;renderModal();return;}
  if(e.key==='Escape'&&LV.state!=='off'){liveClose();return;}
  if(e.key==='Enter'&&e.target.matches('tr[data-act]')){ACT[e.target.dataset.act]?.(e.target,e);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='shSchool'){Store?.setSettings({...S.settings,school:t.value.trim()}).catch(()=>toast('Nama sekolah tidak dapat disimpan.'));}
  else if(t.name==='shForm'){S.sheet.code=+t.value;render();}
  else if(t.id==='rSort'){S.sort=t.value;render();}
  else if(t.id==='kMulti'){S.keyMulti=t.checked;}
  else if(t.id==='mPick'&&S.m){S.m.d.studentId=t.value;S.m.d.name='';const mi=$('#mId');if(mi)mi.value=t.value;}
  else if(t.id==='mSet'&&S.m){S.m.d.set=t.value;renderModal();}
  else if(t.name==='sForm'||t.name==='nqForm'){const max=FORMS[+t.value].size,inp=$(t.name==='sForm'?'#sN':'#nqN');if(inp){inp.max=max;if(+inp.value>max)inp.value=max;}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='shSchool'){S.settings={...S.settings,school:t.value};scheduleSheetPreview();}
  else if(t.id==='shTitle'){S.sheet.title=t.value;scheduleSheetPreview();}
  else if(t.id==='shCls'){S.sheet.cls=t.value;scheduleSheetPreview();}
  else if(t.id==='cRoster'){const n=parseRoster(t.value).length;const c=$('#cCount');if(c)c.textContent=`${n} murid dikesan`;}
  else if(t.id==='mId'&&S.m){S.m.d.studentId=t.value.trim();}
});
let spT;function scheduleSheetPreview(){clearTimeout(spT);spT=setTimeout(()=>{const sp=$('#sheetPrev');if(sp){const c=sheetCanvas(S.sheet.code,sheetOpts(),3);sp.getContext('2d').drawImage(c,0,0);}},250);}
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==='createQuiz'){
    const code=+($('input[name="nqForm"]:checked')?.value||3),max=FORMS[code].size;
    let nQ=Math.round(+$('#nqN').value||0);if(nQ<1)nQ=1;if(nQ>max){nQ=max;toast(`Borang ini maksimum ${max} soalan.`);}
    const id=uid('q'),nSets=+$('#nqSets').value||1,keys={};for(let s=0;s<nSets;s++)keys[LET[s]]=Array(nQ).fill('');
    const doc={name:$('#nqName').value.trim()||'Kuiz tanpa nama',classId:$('#nqClass').value||null,code,nQ,nSets,keys,createdAt:Date.now()};
    try{await Store.setQuiz(id,doc);S.quizzes={...(S.quizzes||{}),[id]:S.quizzes?.[id]||doc};openQuiz(id,'key');toast('Kuiz dicipta. Isi kunci jawapan.');}catch(err){toast('Kuiz tidak dapat disimpan.');}
  }else if(f.dataset.form==='saveSettings'){
    flushKey();const q=curQuiz();if(!q)return;
    const code=+($('input[name="sForm"]:checked')?.value||q.code),max=FORMS[code].size;
    let nQ=Math.round(+$('#sN').value||q.nQ);nQ=Math.max(1,Math.min(max,nQ));
    const nSets=+$('#sSets').value||1,keys=clone(q.keys||{});
    for(let s=0;s<nSets;s++){const k=keys[LET[s]]||[];keys[LET[s]]=Array.from({length:nQ},(_,i)=>(k[i]||'').split('').filter(c=>LET.indexOf(c)<FORMS[code].nOpt).join(''));}
    const {id,...rest}=q;
    try{await Store.setQuiz(q.id,{...rest,name:$('#sName').value.trim()||q.name,classId:$('#sClass').value||null,code,nQ,nSets,keys,updatedAt:Date.now()});toast('Tetapan disimpan');}catch(err){toast('Tetapan tidak dapat disimpan.');}
  }else if(f.dataset.form==='saveClass'){
    const name=$('#cName').value.trim(),students=parseRoster($('#cRoster').value);
    if(!name){toast('Isi nama kelas.');return;}
    const id=S.classId||uid('c'),prev=S.classes?.[id]||{};
    try{await Store.setClass(id,{...prev,name,students,createdAt:prev.createdAt||Date.now(),updatedAt:Date.now()});toast(`Kelas disimpan (${students.length} murid)`);S.view='classes';render();}catch(err){toast('Kelas tidak dapat disimpan.');}
  }
});
$('#fileLogo').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!Store)return;
  try{
    const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();
    const s=Math.min(1,360/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    await Store.setSettings({...S.settings,logo:c.toDataURL('image/jpeg',.88)});toast('Logo disimpan');
  }catch(err){toast('Gambar logo tidak dapat dibuka. Cuba JPG atau PNG.');}
});
$('#fileBackup').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!Store?.importAll)return;
  try{const d=JSON.parse(await f.text());if(!d||d.app!=='SemakKilat'||typeof d.quizzes!=='object')throw 0;await Store.importAll(d);toast(`Sandaran dipulihkan: ${Object.keys(d.quizzes).length} kuiz`);}
  catch(err){toast('Fail ini bukan sandaran SemakKilat.');}
});
['fileCam','fileMany'].forEach(id=>$('#'+id).addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)processFiles(fs);}));
document.addEventListener('dragover',e=>{const d=e.target.closest?.('[data-drop]');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('[data-drop]');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest?.('[data-drop]');if(d){e.preventDefault();d.classList.remove('over');if(e.dataTransfer?.files?.length)processFiles(e.dataTransfer.files);}});
document.addEventListener('paste',e=>{if(S.view!=='quiz'||S.tab!=='scan'||inputFocused())return;const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();processFiles(fs);}});

/* ================= boot ================= */
function setStoreBadge(){const b=$('#store');if(Store.mode==='cloud'){b.className='store cloud';b.textContent='Tersimpan di akaun';b.title='Data peribadi anda; hanya anda boleh melihatnya.';}else{b.className='store local';b.textContent='Tersimpan di pelayar ini';b.title='Log masuk ke claude.ai untuk menyimpan dalam akaun dan guna di peranti lain.';}}
async function boot(){
  render();
  let db=null,uidv=null;
  if(window.claude?.use){
    try{
      const[d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
      S.dl=dl;
      if(d&&u){uidv=await u.id();const cw=await u.can('data.write');if(uidv&&cw!==false)db=d;}
    }catch(e){}
  }
  Store=db?cloudStore(db,uidv):await localStore();
  setStoreBadge();
  Store.onSettings(m=>{S.settings=m||{};loadLogo(S.settings.logo);renderSoft();},()=>{});
  Store.onQuizzes(m=>{S.quizzes=m;renderSoft();},()=>{S.quizzes=S.quizzes||{};renderSoft();});
  Store.onClasses(m=>{S.classes=m;renderSoft();},()=>{S.classes=S.classes||{};renderSoft();});
}
boot();
</script>
